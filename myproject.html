<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="asset/style/style.css">
</head>

<body>
    
    <nav class="navbar">
        <div class="logo">INM</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="myproject.html">Projects</a></li>
        </ul>
        <a href="contact.html" class="btn-contact">Contact Me</a>
    </nav>

    
    <div class="project-container my-5">
        <h2 class="section-title text-center">Add My Project</h2>
        <div class="form-wrapper">
            <form id="projectForm">
                <div class="mb-3">
                    <label for="projectName" class="form-label">Project Name</label>
                    <input type="text" class="form-control" id="projectName" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="startDate" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="startDate" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="endDate" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="endDate" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Technologies</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="nodejs" value="Node.js">
                        <label class="form-check-label" for="nodejs">Node.js</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="reactjs" value="React.js">
                        <label class="form-check-label" for="reactjs">React.js</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="nextjs" value="Next.js">
                        <label class="form-check-label" for="nextjs">Next.js</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="typescript" value="TypeScript">
                        <label class="form-check-label" for="typescript">TypeScript</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="uploadImage" class="form-label">Upload Image</label>
                    <input type="file" class="form-control" id="uploadImage" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>

    
    <div class="project-container mt-5">
        <h2 class="section-title text-center">My Project</h2>
        <div class="row" id="project-list">
            
        </div>
    </div>

    <script src="asset/scripts/index.js"></script>
</body>

</html>
