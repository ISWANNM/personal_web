<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="asset/style/style.css">
</head>

<body>
  <nav class="navbar">
    <div class="logo">INM</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="myproject.html">Projects</a></li>
    </ul>
    <a href="contact.html" class="btn-contact">Contact Me</a>
  </nav>

  
  <div class="container mt-5">
    <div class="card shadow-sm p-4">
      <h2 id="project-title"></h2>
      <img id="project-image" class="img-fluid rounded mb-3" alt="Project Image">
      <p><strong>Duration:</strong> <span id="project-duration"></span></p>
      <p id="project-description"></p>
      <p><strong>Technologies:</strong> <span id="project-tech"></span></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    let projects = JSON.parse(localStorage.getItem("projects")) || [];

    if (id !== null && projects[id]) {
      const project = projects[id];
      document.getElementById("project-title").innerText = project.title;
      document.getElementById("project-image").src = project.image;
      document.getElementById("project-duration").innerText = `${project.startDate} - ${project.endDate}`;
      document.getElementById("project-description").innerText = project.description;
      document.getElementById("project-tech").innerText = project.technologies.join(", ");
    } else {
      document.body.innerHTML = "<h3 class='text-center text-danger mt-5'>Project not found! Silakan kembali ke My Project</h3>";
    }
  </script>
</body>

</html>
